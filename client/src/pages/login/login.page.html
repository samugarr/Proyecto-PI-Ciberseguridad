<main class="auth">
  <section class="auth-brand">
    <img class="auth-brand__logo" src="wizum-logo.png" alt="Wizum" width="460" height="151">
    <p class="auth-brand__lead">Envía dinero a cualquiera con su número de teléfono.</p>

    <div class="ticket" aria-hidden="true">
      <span class="ticket__label">Ingreso</span>
      <span class="ticket__amount">+24,50 €</span>
      <span class="ticket__from">De Lucía</span>
      <span class="ticket__concept">Cena del viernes</span>
    </div>
  </section>

  <section class="auth-panel">
    <div class="auth-form">
      <h1>Inicia sesión</h1>
      <p class="auth-form__sub">Accede a tus movimientos.</p>

      <form class="auth-form__fields" (ngSubmit)="login()">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" [(ngModel)]="email"
                 placeholder="nombre@ejemplo.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" [(ngModel)]="password"
                 autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
      </form>

      <p class="auth-form__switch">¿Aún no tienes cuenta? <a routerLink="/register">Crea una</a></p>
    </div>
  </section>
</main>
