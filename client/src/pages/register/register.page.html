<main class="auth">
  <section class="auth-brand">
    <img class="auth-brand__logo" src="wizum-logo.png" alt="Wizum" width="460" height="151">
    <p class="auth-brand__lead">Tu teléfono es tu cuenta: con él te envían dinero.</p>

    <div class="ticket" aria-hidden="true">
      <span class="ticket__label ticket__label--out">Pago</span>
      <span class="ticket__amount">−12,00 €</span>
      <span class="ticket__from">Para Ruth</span>
      <span class="ticket__concept">Entradas del concierto</span>
    </div>
  </section>

  <section class="auth-panel">
    <div class="auth-form auth-form--wide">
      <h1>Crea tu cuenta</h1>
      <p class="auth-form__sub">Todos los campos son obligatorios.</p>

      <form class="auth-form__fields auth-form__grid" (ngSubmit)="register()">
        <div class="field">
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" [(ngModel)]="name"
                 autocomplete="name" required>
        </div>

        <div class="field">
          <label for="telephone">Teléfono</label>
          <input type="tel" id="telephone" name="telephone" [(ngModel)]="telephone"
                 placeholder="600000000" autocomplete="tel" required>
        </div>

        <div class="field auth-form__full">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" [(ngModel)]="email"
                 placeholder="nombre@ejemplo.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" [(ngModel)]="password"
                 autocomplete="new-password" required>
          <small class="field-hint">Mínimo 10 caracteres, con letras y números.</small>
        </div>

        <div class="field">
          <label for="confirmPassword">Repite la contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword"
                 autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block auth-form__full">Crear cuenta</button>
      </form>

      <p class="auth-form__switch">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </section>
</main>
